<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Room · Sonora</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body data-page="room">
  <div id="err" class="banner err" hidden></div>

  <div class="room-head">
    <div>
      <div class="muted">Room code</div>
      <div id="roomCode" class="code">-----</div>
      <div id="members" class="muted live">Connecting…</div>
    </div>
    <div class="row">
      <button id="copy">Copy invite</button>
      <button id="leave" aria-label="Leave room">Leave</button>
    </div>
  </div>

  <section class="player" aria-label="Now playing">
    <div id="sonar" class="sonar"><img id="art" alt="Album art"></div>
    <div>
      <div id="title" class="title">Nothing playing</div>
      <div id="artist" class="artist">Search for a song below to start the room.</div>
    </div>
    <div class="seek">
      <span id="cur">0:00</span>
      <input id="seek" type="range" min="0" max="1" step="0.1" value="0" aria-label="Seek">
      <span id="dur">0:00</span>
    </div>
    <div class="controls">
      <button id="pp" class="big primary" aria-label="Play or pause">▶</button>
      <button id="next" aria-label="Next song">⏭</button>
    </div>
  </section>

  <h2>Up next</h2>
  <ul id="queue" class="songs queue" style="list-style:none;padding:0;display:grid;gap:8px"></ul>

  <h2>Add a song</h2>
  <form id="searchForm" class="row">
    <input type="search" placeholder="Song or artist" aria-label="Search songs" autocomplete="off">
    <button class="primary" type="submit">Search</button>
  </form>
  <ul id="results" class="songs" style="margin-top:12px"></ul>

  <div id="unlock" hidden>
    <div>
      <p>Your browser needs a tap before it can play audio.</p>
      <button id="unlockBtn" class="primary">Join the music</button>
    </div>
  </div>

  <nav class="tabs" aria-label="Main">
    <a href="index.html">Home</a>
    <a href="search.html">Search</a>
    <a href="library.html">Library</a>
    <a href="room.html" aria-current="page">Room</a>
  </nav>
  <script type="module" src="app.js"></script>
</body>
</html>
